<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Christmas night for two</title>
<link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3eef5;--ink:#2a1f35;--mute:#6c5d7a;--line:#cdbfd8;--card:#fff;--accent:#7a3f9d;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#120d1c;--ink:#eadff2;--mute:#a899b8;--line:#3a2d4d;--card:#1b1429;--accent:#d9a5ff;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#120d1c;--ink:#eadff2;--mute:#a899b8;--line:#3a2d4d;--card:#1b1429;--accent:#d9a5ff;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"VT323",ui-monospace,Menlo,monospace;font-size:21px;line-height:1.3}
main{max-width:760px;margin:0 auto;padding:20px 16px 32px}
h1{font-size:34px;font-weight:400;margin:0 0 4px}
p.sub{margin:0 0 14px;color:var(--mute)}
svg{display:block;width:100%;height:auto;border:2px solid var(--line);image-rendering:pixelated}
.panel{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;margin-top:14px}
.box{background:var(--card);border:2px solid var(--line);padding:10px}
.box h2{font-size:22px;font-weight:400;margin:0 0 6px;color:var(--accent)}
.row{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:4px 0}
input[type=color]{width:40px;height:30px;padding:0;border:2px solid var(--line);background:none;cursor:pointer}
input[type=text],textarea{font:inherit;resize:none;width:100%;color:var(--ink);background:var(--bg);border:2px solid var(--line);padding:4px 8px;margin:3px 0}
button{font:inherit;color:var(--ink);background:var(--card);border:2px solid var(--line);padding:6px 10px;cursor:pointer;width:100%;margin:3px 0}
button[aria-pressed=true]{border-color:var(--accent);color:var(--accent)}
button:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
#scene{--hairA:#5a3a2a;--skinA:#e0ac82;--hairB:#1f1a1a;--skinB:#c98c63;--blanket:#6b4f7a}
.hairA{fill:var(--hairA)}.skinA{fill:var(--skinA)}.hairB{fill:var(--hairB)}.skinB{fill:var(--skinB)}.blk{fill:var(--blanket)}
.breathe{animation:br 4s ease-in-out infinite}
@keyframes br{50%{transform:translateY(1px)}}
.drop{fill:#8fa3d9;opacity:.65;animation:fall 1.2s linear infinite}
@keyframes fall{from{transform:translateY(-10px)}to{transform:translateY(100px)}}
.flame{transform-box:fill-box;transform-origin:50% 100%;animation:fl .7s ease-in-out infinite alternate}
@keyframes fl{from{transform:scale(1,1)}to{transform:scale(.8,1.25)}}
.bulb{animation:tw 2.4s ease-in-out infinite}
@keyframes tw{50%{opacity:.55}}
#dark{opacity:0;transition:opacity .5s}
.off #dark{opacity:.42}.off .glowL{opacity:0}.off .shade{fill:#8a6a4a}
.glowL{transition:opacity .5s}
#snow,.snowsill{display:none}.snow #rain{display:none}.snow #snow,.snow .snowsill{display:inline}.none #rain,.none #snow,.none .snowsill{display:none}
.flake{fill:#fff;opacity:.9;animation:sf 4s linear infinite}@keyframes sf{from{transform:translate(0,-6px)}to{transform:translate(8px,100px)}}
/* sky: night by default, day variants */
.sky{fill:#1e2547}.bld{fill:#141a38}.lt{opacity:1}
.stars,.sun,.sunlight,.cloud{display:none}
.none:not(.day) .stars{display:inline}
.day .sky{fill:#8fd0ff}.day .bld{fill:#6a86a8}.day .lt{opacity:0}
.day.rain .sky{fill:#7f8fa6}.day.snow .sky{fill:#b9c6d8}.day.rain .bld,.day.snow .bld{fill:#55657d}
.day.none .sun,.day.none .sunlight{display:inline}
.day .cloud{display:inline}
.day #dark{opacity:0}
.zz{font-family:"VT323",monospace;font-size:16px;fill:#fff;animation:zf 3s ease-in-out infinite}
@keyframes zf{0%{opacity:0;transform:translate(0,6px)}40%{opacity:.9}100%{opacity:0;transform:translate(6px,-12px)}}
@media (prefers-reduced-motion:reduce){.breathe,.drop,.flame,.bulb,.flake,.zz{animation:none}}
</style>
</head>

<div class="panel">
<div class="box"><h2>Room</h2>
<div class="row"><label for="bk">Blanket</label><input type="color" id="bk" value="#6b4f7a"></div>
<button id="tW">Weather: clear</button>
<button id="tT">Time: night</button>
<button id="tTree" aria-pressed="false">Tree: off</button>
<button id="tGifts" aria-pressed="false">Gifts: off</button>
<button id="tLamp" aria-pressed="true">Lamp on</button></div>
<div class="box"><h2>Message</h2>
<label for="m1">First bubble</label>
<textarea id="m1" rows="2" maxlength="60">good night babi
i love you</textarea>
<label for="m2">Second bubble</label>
<textarea id="m2" rows="2" maxlength="60">i love you too babi
sweet dreams</textarea></div>
</div>

<script>
(function(){
var NS="http://www.w3.org/2000/svg",sc=document.getElementById("scene");
function mk(t,a,p){var e=document.createElementNS(NS,t);for(var k in a)e.setAttribute(k,a[k]);p.appendChild(e);return e}
/* rain */
var rain=document.getElementById("rain");
for(var i=0;i<30;i++){var r=mk("rect",{x:102+Math.round(Math.random()*134),y:24,width:1.5,height:8,class:"drop"},rain);r.style.animationDuration=(0.8+Math.random()*0.8)+"s";r.style.animationDelay=(-Math.random()*1.6)+"s"} 
/* snow */
var sn=document.getElementById("snow");
for(var j=0;j<40;j++){var f=mk("rect",{x:102+Math.round(Math.random()*134),y:24,width:2,height:2,class:"flake"},sn);f.style.animationDuration=(3+Math.random()*3)+"s";f.style.animationDelay=(-Math.random()*6)+"s"}
/* string lights */
var bs=document.getElementById("bulbs"),pts=[[15,13],[45,20],[80,24],[115,23],[150,19],[178,12],[205,13],[235,20],[270,24],[305,23],[340,19],[368,12]],cl=["#ff5a5a","#ffd96a","#6fe08a","#6fb8ff"];
pts.forEach(function(p,i){var c=cl[i%4],g=mk("g",{class:"bulb"},bs);g.style.animationDelay=(-i*0.37)+"s";mk("circle",{cx:p[0],cy:p[1],r:8,fill:c,opacity:.22},g);mk("circle",{cx:p[0],cy:p[1],r:3,fill:c},g)});
/* blanket color */
var bk=document.getElementById("bk");function setBk(){sc.style.setProperty("--blanket",bk.value)}bk.addEventListener("input",setBk);setBk();
/* weather + time */
var W=["none","snow","rain"],wi=0,wb=document.getElementById("tW"),wr=document.getElementById("wrap"),tb=document.getElementById("tT");
function lbl(){var d=wr.classList.contains("day");wb.textContent="Weather: "+(W[wi]==="none"?(d?"sunny":"clear"):W[wi])}
wb.addEventListener("click",function(){wi=(wi+1)%3;wr.classList.remove("snow","rain","none");wr.classList.add(W[wi]);lbl()});
tb.addEventListener("click",function(){var d=wr.classList.toggle("day");tb.textContent="Time: "+(d?"day":"night");lbl()});
/* tree */
var tt=document.getElementById("tTree"),tree=document.getElementById("tree");
tt.addEventListener("click",function(){var p=tt.getAttribute("aria-pressed")!=="true";tt.setAttribute("aria-pressed",p);tt.textContent="Tree: "+(p?"on":"off");tree.style.display=p?"":"none"});
/* gifts */
var gb=document.getElementById("tGifts"),gifts=document.getElementById("gifts");
gb.addEventListener("click",function(){var p=gb.getAttribute("aria-pressed")!=="true";gb.setAttribute("aria-pressed",p);gb.textContent="Gifts: "+(p?"on":"off");gifts.style.display=p?"":"none"});
/* lamp */
var lb=document.getElementById("tLamp");
lb.addEventListener("click",function(){var p=lb.getAttribute("aria-pressed")!=="true";lb.setAttribute("aria-pressed",p);lb.textContent=p?"Lamp on":"Lamp off";wr.classList.toggle("off",!p)});
/* chat bubbles: wrap long text onto several lines */
var MAXW=110,LH=12,els=[["m1","t1","r1"],["m2","t2","r2"]].map(function(a){return{i:document.getElementById(a[0]),t:document.getElementById(a[1]),r:document.getElementById(a[2])}});
function wrap(t,s){var lines=s.split(/\r?\n/).map(function(l){return l.trim()}).filter(Boolean),mw=0;lines.forEach(function(l){t.textContent=l;mw=Math.max(mw,t.getComputedTextLength()||l.length*5)});return{lines:lines,w:mw}}
function layout(){var tails=[document.getElementById("p1"),document.getElementById("p2")],res=els.map(function(e){return wrap(e.t,e.i.value)}),
w=Math.max(res[0].w,res[1].w)+10,rows=Math.max(res[0].lines.length,res[1].lines.length,1),h=rows*LH+4,bottom=115,y=bottom-h,
xs=[102,Math.max(2,96-w)],tx=[103,70];
for(var k=0;k<2;k++){var e=els[k],o=res[k],off=(rows-Math.max(o.lines.length,1))*LH/2;
e.r.setAttribute("x",xs[k]);e.r.setAttribute("y",y);e.r.setAttribute("height",h);e.r.setAttribute("width",w);
e.t.setAttribute("text-anchor","middle");e.t.textContent="";
o.lines.forEach(function(l,n){var s=mk("tspan",{x:xs[k]+w/2},e.t);s.setAttribute("y",y+10+off+n*LH);s.textContent=l});
tails[k].setAttribute("points",tx[k]+","+(bottom-1)+" "+(tx[k]+12)+","+(bottom-1)+" "+(tx[k]+6)+","+(bottom+7))}}
els.forEach(function(e){e.i.addEventListener("input",layout)});layout();if(document.fonts&&document.fonts.ready)document.fonts.ready.then(layout);
})();
</script>
</body>
</html>
